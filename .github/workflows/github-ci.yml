name: "#174 focused validation"

on:
  pull_request:
    branches:
      - validation/kestrel-911-174-upstream-main

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Run #174 focused regressions
        run: |
          chmod +x mvnw
          ./mvnw -ntp -Dtest=OidcMetadataMtlsAliasesTest,ClientRegistrationsMtlsAliasesTest test
