name: generate vue-loader lockfile update

on:
    workflow_dispatch:

jobs:
    gen:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: a8e84d3addc29075849bc43b31e0e656b8a09926

            - name: Use Node 16 so npm 8 keeps lockfileVersion 2
              uses: actions/setup-node@v4
              with:
                  node-version: '16'

            - name: Record the starting state
              run: |
                  node -v && npm -v
                  node -e "console.log('GEN before vue-loader =', require('./package.json').devDependencies['vue-loader'])"
                  node -e "console.log('GEN before lockfileVersion =', require('./package-lock.json').lockfileVersion)"

            - name: Update vue-loader in package.json and the lockfile only
              run: npm install --package-lock-only --no-audit --no-fund --save-dev vue-loader@15.11.1 2>&1 | tail -8

            - name: Record the resulting state
              run: |
                  node -e "console.log('GEN after vue-loader =', require('./package.json').devDependencies['vue-loader'])"
                  node -e "console.log('GEN after lockfileVersion =', require('./package-lock.json').lockfileVersion)"
                  node -e "console.log('GEN after locked vue-loader =', require('./package-lock.json').dependencies['vue-loader'].version)"
                  node -e "console.log('GEN after locked webpack =', require('./package-lock.json').dependencies['webpack'].version)"
                  echo "--- git diff stat ---"
                  git diff --stat

            - name: Upload the updated manifests
              uses: actions/upload-artifact@v4
              with:
                  name: manifests
                  path: |
                      package.json
                      package-lock.json
