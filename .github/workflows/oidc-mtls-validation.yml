name: OIDC mtls_endpoint_aliases validation (#174)

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths: ['.github/workflows/oidc-mtls-validation.yml']

permissions:
    contents: read

jobs:
    validate:
        name: parse mtls_endpoint_aliases before/after the fix
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            PR_SHA: 8dedbe72532034824187a9ea108aa51b96132fff
            BASE_SHA: a8e84d3addc29075849bc43b31e0e656b8a09926
        steps:
            - name: Check out the exact PR #227 commit
              uses: actions/checkout@v4
              with:
                  ref: 8dedbe72532034824187a9ea108aa51b96132fff
                  fetch-depth: 0
                  persist-credentials: false

            - name: Confirm the exact tested carrier
              run: |
                  ACTUAL_SHA="$(git rev-parse HEAD)"
                  echo "HEAD: $ACTUAL_SHA"
                  if [ "$ACTUAL_SHA" != "$PR_SHA" ]; then
                    echo "::error::Expected exact PR #227 head $PR_SHA, got $ACTUAL_SHA"
                    exit 1
                  fi
                  grep -F "<oauth2-oidc-sdk.version>9.43.6</oauth2-oidc-sdk.version>" pom.xml
                  grep -F "<nimbus-jose-jwt.version>9.37.4</nimbus-jose-jwt.version>" pom.xml
                  grep -F 'image: jboss/keycloak:15.0.2' src/main/docker/keycloak.yml
                  test -f src/test/java/tech/jhipster/controlcenter/config/OidcMetadataMtlsAliasesTest.java

            - name: Set up JDK 11
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '11'

            - name: Make the wrapper executable
              run: chmod +x mvnw

            - name: AFTER - resolved Nimbus artifacts (patched pom)
              run: |
                  mvn -ntp -P-webapp dependency:tree -Dincludes=com.nimbusds -DoutputFile=after-tree.txt --batch-mode
                  echo "--- com.nimbusds resolved AFTER the fix ---"
                  grep -i nimbusds after-tree.txt || echo "(none reported)"

            - name: AFTER - run OidcMetadataMtlsAliasesTest (expected PASS)
              run: mvn -ntp -P-webapp test -Dtest=OidcMetadataMtlsAliasesTest -DfailIfNoTests=true --batch-mode

            - name: Restore the unpatched pom from upstream main
              run: |
                  git checkout "$BASE_SHA" -- pom.xml
                  echo "--- override should be BACK now ---"
                  grep -n "oauth2-client.version" pom.xml || echo "(override not found)"

            - name: BEFORE - resolved Nimbus artifacts (unpatched pom)
              run: |
                  mvn -ntp -P-webapp dependency:tree -Dincludes=com.nimbusds -DoutputFile=before-tree.txt --batch-mode
                  echo "--- com.nimbusds resolved BEFORE the fix ---"
                  grep -i nimbusds before-tree.txt || echo "(none reported)"

            - name: BEFORE - run OidcMetadataMtlsAliasesTest (expected FAIL)
              id: before_test
              continue-on-error: true
              run: mvn -ntp -P-webapp test -Dtest=OidcMetadataMtlsAliasesTest -DfailIfNoTests=true --batch-mode

            - name: Summary
              run: |
                  echo "BEFORE (unpatched pom) outcome: ${{ steps.before_test.outcome }}"
                  echo "===== BEFORE tree ====="; cat before-tree.txt || true
                  echo "===== AFTER tree =====";  cat after-tree.txt  || true

            - name: Require the unpatched control to reproduce the regression
              run: |
                  if [ "${{ steps.before_test.outcome }}" != "failure" ]; then
                    echo "::error::Expected the unpatched control to fail; got ${{ steps.before_test.outcome }}"
                    exit 1
                  fi

            - name: Upload dependency trees
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: nimbus-dependency-trees
                  path: |
                      before-tree.txt
                      after-tree.txt
                  if-no-files-found: warn
