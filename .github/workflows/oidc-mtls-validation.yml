name: OIDC mtls_endpoint_aliases validation (#174)

on:
    push:
        branches: [ci/174-validation]
    workflow_dispatch:

jobs:
    validate:
        name: parse mtls_endpoint_aliases before/after the fix
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            BASE_SHA: a8e84d3addc29075849bc43b31e0e656b8a09926
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up JDK 11
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '11'

            - name: Make the wrapper executable
              run: chmod +x mvnw

            - name: AFTER - resolved Nimbus artifacts (patched pom)
              run: |
                  ./mvnw -ntp -P-webapp dependency:tree -Dincludes=com.nimbusds -DoutputFile=after-tree.txt --batch-mode
                  echo "--- com.nimbusds artifacts resolved AFTER the fix ---"
                  grep -i nimbusds after-tree.txt || echo "(no com.nimbusds artifacts reported)"

            - name: AFTER - run OidcMetadataMtlsAliasesTest (expected to PASS)
              run: ./mvnw -ntp -P-webapp test -Dtest=OidcMetadataMtlsAliasesTest -DfailIfNoTests=true --batch-mode

            - name: Restore the unpatched pom from upstream main
              run: |
                  git checkout "$BASE_SHA" -- pom.xml
                  echo "--- oauth2-client override present again? ---"
                  grep -n "oauth2-client.version" pom.xml || echo "(override not found)"

            - name: BEFORE - resolved Nimbus artifacts (unpatched pom)
              run: |
                  ./mvnw -ntp -P-webapp dependency:tree -Dincludes=com.nimbusds -DoutputFile=before-tree.txt --batch-mode
                  echo "--- com.nimbusds artifacts resolved BEFORE the fix ---"
                  grep -i nimbusds before-tree.txt || echo "(no com.nimbusds artifacts reported)"

            - name: BEFORE - run OidcMetadataMtlsAliasesTest (expected to FAIL)
              id: before_test
              continue-on-error: true
              run: ./mvnw -ntp -P-webapp test -Dtest=OidcMetadataMtlsAliasesTest -DfailIfNoTests=true --batch-mode

            - name: Report the before/after outcome
              run: |
                  echo "BEFORE (unpatched pom) test outcome: ${{ steps.before_test.outcome }}"
                  echo "--- BEFORE tree ---"; cat before-tree.txt || true
                  echo "--- AFTER tree ---";  cat after-tree.txt  || true

            - name: Upload dependency trees
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: nimbus-dependency-trees
                  path: |
                      before-tree.txt
                      after-tree.txt
                  if-no-files-found: warn
