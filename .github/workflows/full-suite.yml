name: Full backend suite, patched vs baseline (#174)

on:
    workflow_dispatch:

jobs:
    suite:
        name: "${{ matrix.leg }}"
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    - leg: 'patched (PR 227 head)'
                      restore_baseline: 'no'
                    - leg: 'baseline (upstream pom)'
                      restore_baseline: 'yes'
        env:
            PR_SHA: d8664ee33600c303f0f25feebcb05b11c009fccb
            BASE_SHA: a8e84d3addc29075849bc43b31e0e656b8a09926
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: d8664ee33600c303f0f25feebcb05b11c009fccb
                  fetch-depth: 0

            - name: Set up JDK 11
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '11'

            - name: Restore the upstream pom for the baseline leg
              if: matrix.restore_baseline == 'yes'
              run: |
                  git checkout "$BASE_SHA" -- pom.xml
                  echo "baseline pom restored"

            - name: Show resolved Nimbus artifacts
              run: mvn -ntp -P-webapp dependency:tree -Dincludes=com.nimbusds --batch-mode | grep -i nimbusds || true

            - name: Run the full backend test suite
              id: suite
              continue-on-error: true
              run: |
                  mvn -ntp -P-webapp verify --batch-mode \
                    -Dlogging.level.ROOT=OFF \
                    -Dlogging.level.org.zalando=OFF \
                    -Dlogging.level.tech.jhipster=OFF \
                    -Dlogging.level.tech.jhipster.controlcenter=OFF \
                    -Dlogging.level.org.springframework=OFF

            - name: Summarise results
              if: always()
              run: |
                  echo "LEG: ${{ matrix.leg }}"
                  echo "SUITE OUTCOME: ${{ steps.suite.outcome }}"
                  echo "----- per-class results -----"
                  if [ -d target/surefire-reports ]; then
                    grep -h "Tests run" target/surefire-reports/*.txt 2>/dev/null | sed 's/^/  /' || echo "  (none)"
                  else
                    echo "  (no surefire reports)"
                  fi
                  echo "----- failures and errors -----"
                  grep -rl "FAILURE\|<<< ERROR" target/surefire-reports/*.txt 2>/dev/null | while read f; do
                    echo "### $f"; sed -n '1,40p' "$f"
                  done || echo "  (none)"
                  echo "----- NoSuchMethod / NoClassDefFound scan -----"
                  grep -rh "NoSuchMethodError\|NoClassDefFoundError\|NoSuchFieldError" target/surefire-reports/ 2>/dev/null | head -20 || echo "  none found"
