# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
version: '3.8'
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command:
      - start-dev
      - --http-port=9080
      - --http-relative-path=/auth
      - --import-realm
    volumes:
      - ./realm-config:/opt/keycloak/data/import
    environment:
      # KC_BOOTSTRAP_ADMIN_* is used from Keycloak 26; KEYCLOAK_ADMIN_* is kept for older tags
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # Hostname v2 full URL must include the /auth relative path. A hostname of
      # http://localhost:9080 (no path) makes discovery advertise
      # issuer=http://localhost:9080/realms/jhipster, which Spring Security 5.4
      # ClientRegistrations rejects against issuer-uri
      # http://localhost:9080/auth/realms/jhipster (IllegalStateException).
      # Scheme is http so Cypress/Spring are not sent to https://localhost:9080.
      - KC_HOSTNAME=http://localhost:9080/auth
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    ports:
      - 9080:9080
      - 9443:9443
